<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Rubik's Cube</title>
<style>
  :root{--bg:#f3f3f1;--fg:#111;--muted:#8b8b87;--glass:rgba(255,255,255,.62);--hover:rgba(0,0,0,.06)}
  @media (prefers-color-scheme:dark){:root{--bg:#0e0e0f;--fg:#f2f2f0;--muted:#77777b;--glass:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08)}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;-webkit-user-select:none;user-select:none}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas.grabbing{cursor:grabbing}
  .hud{position:fixed;top:20px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:baseline;pointer-events:none}
  .title{font-weight:600;letter-spacing:-.01em}
  .stats{color:var(--muted);font-variant-numeric:tabular-nums}
  .stats b{color:var(--fg);font-weight:500}
  .solved{position:fixed;top:56px;left:0;right:0;text-align:center;font-weight:500;opacity:0;transition:opacity .4s;pointer-events:none}
  .solved.on{opacity:1}
  .bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:14px;
    background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4)}
  button{font:inherit;color:var(--fg);background:transparent;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;transition:background .15s}
  button:hover{background:var(--hover)}
  button:active{transform:scale(.97)}
  .hint{position:fixed;bottom:84px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px;pointer-events:none;padding:0 16px}
  @media (max-width:520px){.hud{left:16px;right:16px}.bar{bottom:16px}.hint{bottom:72px}button{padding:9px 13px}}
</style>
</head>
<body>
<div class="hud">
  <div class="title">Cube</div>
  <div class="stats"><b id="time">0:00.0</b> · <b id="moves">0</b> moves</div>
</div>
<div class="solved" id="solved">Solved</div>
<div class="hint">Drag a face to turn it · drag the background to orbit · keys U D L R F B (Shift = reverse)</div>
<div class="bar">
  <button id="scramble">Scramble</button>
  <button id="undo">Undo</button>
  <button id="reset">Reset</button>
</div>

  LOGOS.mpc = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTg0IiB2aWV3Qm94PSI0LjIgMi4yIDE1LjYgMTkuOCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJNUEMiPgogIDxnIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2MyNzczZiIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+CiAgICA8cGF0aCBkPSJNMTIgMyBMMTkgOSBMMTIgMjEgTDUgOSBaIiBzdHJva2Utd2lkdGg9IjEuMyIgZmlsbD0iI2MyNzczZiIgZmlsbC1vcGFjaXR5PSIwLjEyIi8+CiAgICA8cGF0aCBkPSJNNSA5IEgxOSIgc3Ryb2tlLXdpZHRoPSIxIi8+CiAgICA8cGF0aCBkPSJNMTIgMyBMOC41IDkiIHN0cm9rZS13aWR0aD0iMSIvPgogICAgPHBhdGggZD0iTTEyIDMgTDE1LjUgOSIgc3Ryb2tlLXdpZHRoPSIxIi8+CiAgICA8cGF0aCBkPSJNOC41IDkgTDEyIDIxIiBzdHJva2Utd2lkdGg9IjEiLz4KICAgIDxwYXRoIGQ9Ik0xNS41IDkgTDEyIDIxIiBzdHJva2Utd2lkdGg9IjEiLz4KICA8L2c+Cjwvc3ZnPgo="; // MPC mark on the white top face, in its own copper colour
  const LOGO_FACE = { 4: 'tenger', 0: 'ubbw', 5: 'krypto', 1: 'ard', 2: 'mpc' }; // F green, R red, B blue, L orange, U white
  const logoGeo = new THREE.PlaneGeometry(0.8, 0.8);
  const logoMats = {};
  Object.keys(LOGOS).forEach(k => {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    // raised logo: a lit top surface plus darker layers underneath that read as its edge, and a shadow cut to the logo shape
    logoMats[k] = {
      top: new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.35, envMapIntensity: 0.35 }), // smooth edges
      side: new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.3, roughness: 0.5, envMapIntensity: 0.2, color: 0x8a8a8a }),
      depth: new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.3 }),
    };
    const img = new Image();
    img.onload = () => {
      const ctx = c.getContext('2d');
      const s = Math.min(488 / img.width, 360 / img.height);
      const w = img.width * s, h = img.height * s;
      ctx.drawImage(img, (512 - w) / 2, (512 - h) / 2, w, h);
      if (k === 'ard') { // the ARD file is grey; recolour it white to match the other (already white) logos
        ctx.globalCompositeOperation = 'source-in';
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, 512, 512);
      }
      tex.needsUpdate = true;
    };
    img.src = LOGOS[k];
  });

  const Z = new V(0, 0, 1);

  const cube = new THREE.Group();
  scene.add(cube);
  const pivot = new THREE.Object3D();
  cube.add(pivot);
  let cubies = [], stickers = [];

  function build() {
    cubies.forEach(c => c.parent.remove(c));
    cubies = []; stickers = [];
    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      // stickerless: outer faces are coloured plastic, inner faces stay dark (groups follow FACES order +x,-x,+y,-y,+z,-z)
      const body = new THREE.Mesh(bodyGeo, FACES.map((f, i) => f.n.x * x + f.n.y * y + f.n.z * z === 1 ? stickerMats[i] : bodyMat));
      body.castShadow = body.receiveShadow = true;
      g.add(body);
      FACES.forEach((f, i) => {
        if (f.n.x * x + f.n.y * y + f.n.z * z !== 1) return;
        const s = new THREE.Object3D(); // face marker: tracks orientation for the solved check and holds the logo
        s.position.copy(f.n).multiplyScalar(0.487);
        s.quaternion.setFromUnitVectors(Z, f.n);
        s.userData.face = i;
        if (x * x + y * y + z * z === 1 && LOGO_FACE[i]) {
          const m = logoMats[LOGO_FACE[i]];
          const RAISE = { ubbw: 0.006, krypto: 0.009, mpc: 0.006 }[LOGO_FACE[i]] || 0.014, LAYERS = 24; // thin-stroke logos sit lower so their letters stay crisp
          for (let l = 0; l <= LAYERS; l++) {
            const logo = new THREE.Mesh(logoGeo, l === LAYERS ? m.top : m.side);
            logo.position.z = 0.002 + RAISE * l / LAYERS;
            logo.customDepthMaterial = m.depth;
            logo.castShadow = l === LAYERS;
            logo.receiveShadow = true;
            s.add(logo);
          }
        }
        g.add(s); stickers.push(s);
      });
      cube.add(g); cubies.push(g);
    }
  }

  // ---------- layer turns ----------
  let active = [], turnDim = 0;
  function beginLayer(dim, layer) {
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld(true);
    turnDim = dim;
    active = cubies.filter(c => Math.round(c.position[AX[dim]]) === layer);
    active.forEach(c => pivot.attach(c));
  }
  function setLayerAngle(a) {
    pivot.rotation.set(0, 0, 0);
    pivot.rotation[AX[turnDim]] = a;
  }
  const m4 = new THREE.Matrix4();
  function endLayer() {
    pivot.updateMatrixWorld(true);
    active.forEach(c => {
      cube.attach(c);
      c.position.set(Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z));
      m4.makeRotationFromQuaternion(c.quaternion);
      const e = m4.elements;
      [0, 1, 2, 4, 5, 6, 8, 9, 10].forEach(i => e[i] = Math.round(e[i]));
      c.quaternion.setFromRotationMatrix(m4);
    });
    active = [];
    pivot.rotation.set(0, 0, 0);
  }

  // ---------- game state ----------
  const queue = [], history = [];
  let anim = null, moves = 0, scrambled = false, timerStart = 0, timerEnd = 0, scrambling = false;
  const $ = id => document.getElementById(id);
  const ease = t => 1 - Math.pow(1 - t, 3);

  function enqueue(dim, layer, angle, opts = {}) { queue.push({ dim, layer, angle, ...opts }); }

  function startAnim(from, to, dur, done) { anim = { from, to, dur, t0: performance.now(), done }; }

  function pump() {
    if (anim || drag && drag.mode !== 'orbit' || !queue.length) return;
    const m = queue.shift();
    beginLayer(m.dim, m.layer);
    startAnim(0, m.angle, m.fast ? 90 : 200, () => {
      endLayer();
      commit(m, m.record !== false);
      if (m.last) { scrambling = false; scrambled = true; moves = 0; timerStart = 0; timerEnd = 0; history.length = 0; updateStats(); }
    });
  }

  function commit(m, record) {
    const q = Math.round(m.angle / (Math.PI / 2));
    if (q === 0 || scrambling) return;
    if (record) history.push({ dim: m.dim, layer: m.layer, angle: q * Math.PI / 2 });
    moves++;
    if (scrambled && !timerStart) timerStart = performance.now();
    checkSolved();
    updateStats();
  }

  function checkSolved() {
    cube.updateMatrixWorld(true);
    const seen = {};
    const n = new V();
    for (const s of stickers) {
      n.set(0, 0, 1).transformDirection(s.matrixWorld);
      const k = Math.round(n.x) + ',' + Math.round(n.y) + ',' + Math.round(n.z);
      if (seen[k] === undefined) seen[k] = s.userData.face;
      else if (seen[k] !== s.userData.face) { $('solved').classList.remove('on'); return false; }
    }
    if (scrambled) {
      scrambled = false;
      timerEnd = performance.now();
      $('solved').classList.add('on');
    }
    return true;
  }

  function fmt(ms) {
    const s = ms / 1000, m = Math.floor(s / 60);
    return m + ':' + (s - m * 60).toFixed(1).padStart(4, '0');
  }
  function updateStats() {
    $('moves').textContent = moves;
    const t = timerStart ? (timerEnd || performance.now()) - timerStart : 0;
    $('time').textContent = fmt(t);
  }

  function scramble() {
    if (anim || queue.length || drag) return;
    $('solved').classList.remove('on');
    scrambling = true;
    let last = -1;
    for (let i = 0; i < 25; i++) {
      let dim; do { dim = Math.floor(Math.random() * 3); } while (dim === last);
      last = dim;
      const layer = [-1, 0, 1][Math.floor(Math.random() * 3)];
      const angle = (Math.random() < 0.5 ? 1 : -1) * Math.PI / 2;
      enqueue(dim, layer, angle, { fast: true, record: false, last: i === 24 });
    }
  }
  function reset() {
    if (anim || queue.length || drag) return;
    build();
    moves = 0; timerStart = timerEnd = 0; scrambled = false; history.length = 0;
    $('solved').classList.remove('on');
    updateStats();
  }
  function undo() {
    if (anim || queue.length || drag || !history.length) return;
    const m = history.pop();
    enqueue(m.dim, m.layer, -m.angle, { record: false });
  }
  $('scramble').onclick = scramble;
  $('reset').onclick = reset;
  $('undo').onclick = undo;

  // Standard notation: clockwise as seen looking at that face
  const KEYS = { r: [0, 1, -1], l: [0, -1, 1], u: [1, 1, -1], d: [1, -1, 1], f: [2, 1, -1], b: [2, -1, 1],
                 m: [0, 0, 1], e: [1, 0, 1], s: [2, 0, -1] };
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = KEYS[e.key.toLowerCase()];
    if (!k || scrambling) return;
    const sign = e.shiftKey ? -1 : 1;
    enqueue(k[0], k[1], k[2] * sign * Math.PI / 2);
  });

  // ---------- pointer interaction ----------
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let drag = null;

  function pick(e) {
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(cubies, true)[0];
    if (!hit) return null;
    const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
    // snap to the dominant axis (hits on the rounded edges have diagonal normals)
    const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
    n.set(ax >= ay && ax >= az ? Math.sign(n.x) : 0, ay > ax && ay >= az ? Math.sign(n.y) : 0, az > ax && az > ay ? Math.sign(n.z) : 0);
    let cubie = hit.object;
    while (cubie && !cubies.includes(cubie)) cubie = cubie.parent;
    return { point: hit.point.clone(), normal: n, cubie };
  }
  function toScreen(v) {
    const p = v.clone().project(camera);
    return new THREE.Vector2((p.x + 1) / 2 * innerWidth, (1 - p.y) / 2 * innerHeight);
  }

  canvas.addEventListener('pointerdown', e => {
    if (drag) return;
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('grabbing');
    const busy = anim || queue.length || scrambling;
    const hit = busy ? null : pick(e);
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, mode: hit ? 'pending' : 'orbit', hit };
  });

  canvas.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;

    if (drag.mode === 'orbit') {
      view.theta -= dx * 0.008;
      view.phi = Math.min(Math.PI - 0.12, Math.max(0.12, view.phi - dy * 0.008));
      placeCamera();
      return;
    }

    const total = new THREE.Vector2(e.clientX - drag.x0, e.clientY - drag.y0);
    if (drag.mode === 'pending') {
      if (total.length() < 8) return;
      const { normal: n, point: p, cubie } = drag.hit;
      const s0 = toScreen(p);
      let best = null;
      [new V(1, 0, 0), new V(0, 1, 0), new V(0, 0, 1)].forEach(t => {
        if (Math.abs(t.dot(n)) > 0.5) return;
        const d = toScreen(p.clone().add(t)).sub(s0);
        const len = d.length();
        if (len < 1e-3) return;
        d.divideScalar(len);
        const score = Math.abs(d.dot(total) / total.length());
        if (!best || score > best.score) best = { t, dir: d, len, score };
      });
      if (!best) { drag.mode = 'orbit'; return; }
      const a = new V().crossVectors(n, best.t); // rotation axis that moves the hit point along t
      const dim = Math.abs(a.x) > 0.5 ? 0 : Math.abs(a.y) > 0.5 ? 1 : 2;
      const layer = Math.round(cubie.position.getComponent(dim));
      Object.assign(drag, { mode: 'turn', dir: best.dir, len: best.len, sign: Math.sign(a.getComponent(dim)), dim, layer });
      beginLayer(dim, layer);
    }
    if (drag.mode === 'turn') {
      drag.angle = drag.sign * total.dot(drag.dir) / drag.len;
      setLayerAngle(drag.angle);
    }
  });

  function release(e) {
    if (!drag || e.pointerId !== drag.id) return;
    canvas.classList.remove('grabbing');
    const d = drag;
    drag = null;
    if (d.mode !== 'turn') return;
    const from = d.angle || 0;
    const to = Math.round(from / (Math.PI / 2)) * (Math.PI / 2);
    const m = { dim: d.dim, layer: d.layer, angle: to };
    startAnim(from, to, 90 + Math.abs(to - from) * 160, () => { endLayer(); commit(m, true); });
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    view.zoom = Math.min(1.8, Math.max(0.7, view.zoom * (1 + Math.sign(e.deltaY) * 0.08)));
    placeCamera();
  }, { passive: false });

  // ---------- loop ----------
  function frame(now) {
    if (anim) {
      const t = Math.min(1, (now - anim.t0) / anim.dur);
      setLayerAngle(anim.from + (anim.to - anim.from) * ease(t));
      if (t >= 1) { const done = anim.done; anim = null; done(); }
    }
    pump();
    if (timerStart && !timerEnd) updateStats();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  build();
  resize();
  updateStats();
  requestAnimationFrame(frame);
  window.__cube = { checkSolved, enqueue, get busy() { return !!(anim || queue.length); } };
})();
</script>
</body>
</html>
